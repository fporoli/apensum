name: Private plugins
description: >
  Clones the private plugins named in the repository variable PRIVATE_PLUGINS into plugins/<id>
  (docs/PLUGINS.md, "Builds and deploys"), with the PLUGINS_TOKEN secret. Nothing to do when the
  variable is empty, so forks and the core alone build as before.
inputs:
  plugins:
    description: "Plugins, separated by spaces or new lines: <id>=<owner>/<repo>[@<ref>], e.g. hr=fporoli/apensum-hr"
    required: false
    default: ''
  token:
    description: Token with read access to the plugins' repositories (contents)
    required: false
    default: ''
outputs:
  ids:
    description: The plugin ids cloned, separated by spaces (empty = none)
    value: ${{ steps.clone.outputs.ids }}
runs:
  using: composite
  steps:
    - id: clone
      shell: bash
      env:
        PLUGINS: ${{ inputs.plugins }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        ids=""
        for spec in $PLUGINS; do
          id="${spec%%=*}"; rest="${spec#*=}"; repo="${rest%%@*}"; ref=""
          [ "$rest" != "$repo" ] && ref="${rest#*@}"
          if ! [[ "$id" =~ ^[a-z][a-zA-Z0-9]*$ && "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::PRIVATE_PLUGINS: '$spec' is not <id>=<owner>/<repo>[@<ref>]"; exit 1
          fi
          [ -n "$TOKEN" ] || { echo "::error::PRIVATE_PLUGINS is set but the PLUGINS_TOKEN secret is not"; exit 1; }
          [ ! -e "plugins/$id" ] || { echo "::error::plugins/$id already exists (a bundled plugin of that id?)"; exit 1; }
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" clone --quiet --depth 1 ${ref:+--branch "$ref"} "https://github.com/$repo.git" "plugins/$id"
          echo "plugin $id: $repo@$(git -C "plugins/$id" rev-parse --short HEAD)"
          rm -rf "plugins/$id/.git"
          ids="$ids $id"
        done
        echo "ids=${ids# }" >> "$GITHUB_OUTPUT"
