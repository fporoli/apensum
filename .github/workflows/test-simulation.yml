name: Dolphin and Whale simulation (VPS)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: VPS environment to populate
        type: choice
        required: true
        default: test
        options:
          - test
          - preprod
      confirmation:
        description: For preprod, enter exactly SIMULATE preprod
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: worktime3-vps
  cancel-in-progress: false

jobs:
  simulate:
    if: github.ref == 'refs/heads/test/dolphin-whale-simulation'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Confirm preprod target
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$TARGET_ENVIRONMENT" == "preprod" && "$CONFIRMATION" != "SIMULATE preprod" ]]; then
            echo "Preprod requires the exact confirmation: SIMULATE preprod" >&2
            exit 1
          fi
      - name: Upload simulation files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: test/simulation/history.sql,test/simulation/run.cjs
          target: /tmp/apensum-${{ inputs.environment }}-simulation-${{ github.run_id }}
      - name: Seed and verify on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu
            environment=${{ inputs.environment }}
            container="apensum-${environment}-api"
            src="/tmp/apensum-${environment}-simulation-${{ github.run_id }}"
            dst=/app/test/simulation-${{ github.run_id }}
            trap 'docker exec "$container" rm -rf "$dst"; rm -rf "$src"' EXIT
            docker exec "$container" mkdir -p "$dst"
            docker cp "$src/test/simulation/." "$container:$dst/"
            docker exec "$container" node "$dst/run.cjs" "vps-$environment"
