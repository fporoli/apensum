name: Whale simulation (VPS)

# A company's life since 2008 on a test instance (test/simulation/README.md): the instance is reset (demo seed), then
# test/simulation/life.cjs plays Whale day by day through the API's services inside the API container, and checks it
# over HTTP. From main, only on test or preprod (preprod with a typed confirmation).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: VPS environment to reset and populate
        type: choice
        required: true
        default: test
        options:
          - test
          - preprod
      confirmation:
        description: For preprod, enter exactly SIMULATE preprod
        type: string
        required: false
      founded:
        description: Whale's founding day, YYYY-MM-DD (empty = 2015-01-01; later = fewer years, a quicker run)
        type: string
        required: false

permissions:
  contents: read
  actions: write

# Its own group: the reset it dispatches runs in the deploy workflows' group (worktime3-vps).
concurrency:
  group: whale-simulation-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  simulate:
    if: github.ref == 'refs/heads/main'
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm preprod target
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$TARGET_ENVIRONMENT" == "preprod" && "$CONFIRMATION" != "SIMULATE preprod" ]]; then
            echo "Preprod requires the exact confirmation: SIMULATE preprod" >&2
            exit 1
          fi
      - name: Check the founding day
        env:
          FOUNDED: ${{ inputs.founded }}
        run: |
          # Checked here, before it reaches the instance's shell: a real day from 2000 to yesterday, or empty.
          if [[ -n "$FOUNDED" ]]; then
            [[ "$FOUNDED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && date -d "$FOUNDED" +%F | grep -qx "$FOUNDED" \
              && [[ "$FOUNDED" > "1999-12-31" && "$FOUNDED" < "$(date -u +%F)" ]] \
              || { echo "founded: a day YYYY-MM-DD from 2000 to yesterday, not '$FOUNDED'" >&2; exit 1; }
          fi
      - name: Reset the instance (vps.yml reset-seed with main's image)
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -eu
          tag="sha-$(git rev-parse HEAD | cut -c1-7)"
          echo "Resetting $TARGET_ENVIRONMENT with $tag"
          before=$(gh run list --workflow vps.yml -L 1 --json databaseId -q '.[0].databaseId' || echo 0)
          gh workflow run vps.yml --ref main -f action=reset-seed -f environment="$TARGET_ENVIRONMENT" -f image_tag="$tag" -f confirmation='RESET worktime3 public schema'
          for i in $(seq 1 30); do
            run=$(gh run list --workflow vps.yml -L 1 --json databaseId -q '.[0].databaseId')
            [ "$run" != "$before" ] && break
            sleep 5
          done
          gh run watch "$run" --exit-status --interval 15
      - name: Upload the simulation
        uses: appleboy/scp-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: test/simulation/life.cjs
          target: /tmp/apensum-${{ inputs.environment }}-simulation-${{ github.run_id }}
      - name: Live Whale's years and check them
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 280m
          script: |
            set -eu
            environment=${{ inputs.environment }}
            container="apensum-${environment}-api"
            src="/tmp/apensum-${environment}-simulation-${{ github.run_id }}"
            dst=/app/test/simulation-${{ github.run_id }}
            # A cancelled run (the SSH session ends) stops the simulation too, then tidies up.
            # [l]ife.cjs: the pattern must not match pkill's own command line.
            trap 'docker exec "$container" pkill -f "$dst/[l]ife.cjs" || true; docker exec "$container" rm -rf "$dst" || true; rm -rf "$src"' EXIT HUP INT TERM
            docker exec "$container" mkdir -p "$dst"
            docker cp "$src/test/simulation/." "$container:$dst/"
            docker exec -e APENSUM_ROOT=/app -e SIM_FOUNDED=${{ inputs.founded || '2015-01-01' }} "$container" node "$dst/life.cjs" "vps-$environment"
