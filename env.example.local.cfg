# --- public examples (copy to .env.local etc; never commit real secrets) ---
# ENV_NUMBER selects the port offsets: 8090+N keycloak, 5430+N pg, 3000+N web, 8000+N api
ENV_NUMBER=2
POSTGRES_PORT=5432
POSTGRES_HOST=localhost
POSTGRES_DB=worktime
POSTGRES_USER=worktime
POSTGRES_PASSWORD=worktime_dev_only
DATABASE_URL=postgresql://worktime:worktime_dev_only@localhost:5432/worktime
# Backend uses the `public` schema; Keycloak uses the `auth` schema of the SAME database.
KC_DB_SCHEMA=auth
KEYCLOAK_ADMIN=admin
KEYCLOAK_ADMIN_PASSWORD=admin_dev_only
KEYCLOAK_REALM=worktime
# Azure Entra ID (optional, link/unlink supported in API + UI)
AZURE_TENANT_ID=
AZURE_CLIENT_ID=
AZURE_CLIENT_SECRET=
API_PORT=8002
WEB_PORT=3002
KC_PORT=8092
JWT_ISSUER=http://localhost:8092/realms/worktime
# Expected Keycloak token audience (client id); local API tokens use API_JWT_SECRET (HS256)
JWT_AUDIENCE=worktime-web
API_JWT_SECRET=dev-only-secret-change-me
# Master key for encrypting stored documents at rest (32 bytes, base64): `openssl rand -base64 32`.
# Empty -> documents are stored unencrypted (the API warns at startup). Keep a copy in a safe place:
# without it the encrypted documents cannot be read. Rotation: put the new key here, the old one in
# DOCUMENTS_KEY_PREVIOUS (comma-separated), then `npm run db:encrypt-documents -- --rewrap`.
DOCUMENTS_KEY=
DOCUMENTS_KEY_PREVIOUS=
# Outgoing mail. Unauthenticated by default -> the stack's Mailpit (host `mailpit` inside Docker;
# inbox UI on :8025). Set SMTP_USER + SMTP_PASSWORD to send through a real relay instead
# (nodemailer negotiates STARTTLS/AUTH itself); add SMTP_SECURE=true for an implicit-TLS
# relay (typically port 465).
SMTP_HOST=mailpit
SMTP_PORT=1025
SMTP_FROM=worktime@localhost
SMTP_USER=
SMTP_PASSWORD=
SMTP_SECURE=false
# Base URL used for links inside outgoing mail (invite accept links)
APP_BASE_URL=http://localhost:3002
# AI: Azure OpenAI in Switzerland is the only provider (the chat assistant, Cases transcription/summaries/drafts,
# receipt recognition), every call through the budget. Optional and paid: it stays off unless the key,
# AI_MONTHLY_BUDGET_CHF and all three prices are set (fail closed); the assistant then answers
# assistant-not-configured. Resources: infra/azure/ai-provision.sh (Switzerland North, Standard deployments;
# `ai-provision.sh local` fills this file).
# AI_MONTHLY_BUDGET_CHF caps the whole instance per month; each org has its own limit (default CHF 10).
# AI_AZURE_ENABLED=false is the kill switch. Prices in CHF from your Azure price sheet (round up).
# AZURE_OPENAI_ENDPOINT=https://<resource>.openai.azure.com
# AZURE_OPENAI_KEY=
# AZURE_OPENAI_DEPLOYMENT=gpt-4.1-mini
# AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT=whisper
AI_MONTHLY_BUDGET_CHF=5
# AI_AZURE_ENABLED=true
AZURE_TRANSCRIBE_CHF_PER_HOUR=1.00
AZURE_OPENAI_CHF_PER_1M_INPUT=0.50
AZURE_OPENAI_CHF_PER_1M_OUTPUT=2.00
