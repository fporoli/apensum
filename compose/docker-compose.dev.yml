# `dev` profile: pg + Mailpit in Docker (Dex too with COMPOSE_PROFILES=dex), API and web on the host. Data lives under
# ../data-dev (the `local` profile uses ../data-local).
name: worktime-dev
services:
  pg:
    image: postgres:16
    ports: ["5431:5432"]
    environment:
      POSTGRES_DB: worktime
      POSTGRES_USER: worktime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worktime_dev_only}
    volumes:
      - ../data-dev/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worktime"]
      interval: 2s
      timeout: 3s
      retries: 30
  # One-shot: applies infra/liquibase/changelog via Liquibase, then exits.
  # Schema is no longer seeded through docker-entrypoint-initdb.d — that only
  # ever ran once, on an empty volume, which is exactly how this local
  # database went stale relative to schema.sql in the past. Liquibase tracks
  # applied changesets in the database itself, so `migrate` is safe to rerun
  # on every `docker compose up`.
  migrate:
    build: { context: ../infra/liquibase, dockerfile: Dockerfile }
    volumes:
      - ../infra/liquibase/changelog:/liquibase/changelog:ro
      # Plugin changelogs (plugins/<id>/changelog), run after the core's by apensum-migrate.sh.
      - ../plugins:/liquibase/plugins:ro
    command:
      - --changelog-file=db.changelog-master.xml
      - --url=jdbc:postgresql://pg:5432/worktime
      - --username=worktime
      - --password=${POSTGRES_PASSWORD:-worktime_dev_only}
      - update
    depends_on:
      pg: { condition: service_healthy }
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      # Newer Mailpit refuses AUTH over a plaintext connection unless told this is
      # intentional. Fine here — this catcher never leaves localhost, no real mail.
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  # Optional single sign-on to try the SSO login (infra/dex/dev.yaml, a test login without a password):
  # COMPOSE_PROFILES=dex and SSO_PROVIDER=dex in .env.dev. Off by default.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1
    profiles: [dex]
    ports: ["8091:5556"]
    volumes:
      - ../infra/dex/dev.yaml:/etc/dex/apensum.yaml:ro
    command: ["dex", "serve", "/etc/dex/apensum.yaml"]
