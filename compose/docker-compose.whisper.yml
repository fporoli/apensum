# The one Whisper sidecar on this machine, shared by dev and local (`npm run whisper:up`).
# Its own Compose project, so starting, stopping or resetting dev or local never touches it.
#   - dev (API on the host) reaches it on 127.0.0.1:${CASES_WHISPER_PORT:-8081}
#     (CASES_WHISPER_URL=http://127.0.0.1:8081 in .env.dev);
#   - local (API in Docker) reaches it as `whisper` on the internal network `apensum-whisper`
#     (CASES_WHISPER_URL=http://whisper:8080 in .env.local).
# The network is created by scripts/whisper.mjs (`docker network create --internal`), not by
# any Compose project, so every project can join it as `external`.
name: apensum-whisper
services:
  whisper:
    extends: { file: whisper.service.yml, service: whisper }
    container_name: apensum-whisper
    ports: ['127.0.0.1:${CASES_WHISPER_PORT:-8081}:8080']
    networks:
      default: {}
      whisper: { aliases: [whisper] }
    restart: unless-stopped

networks:
  whisper:
    name: apensum-whisper
    external: true
