# --- Azure Container Apps config for infra/azure/provision.sh ---
# Copy to infra/azure/.env.azure (gitignored) and fill in. Never commit real values.

# Target tenant/subscription (az account show --query "{tenant:tenantId, sub:id}").
AZURE_TENANT_ID=
AZURE_SUBSCRIPTION_ID=
LOCATION=switzerlandnorth
RESOURCE_GROUP=rg-worktime3

# Postgres Flexible Server name: globally unique, 3-63 lowercase letters/digits/hyphens.
PG_SERVER_NAME=
# Storage account for the API's uploaded documents: globally unique, 3-24 lowercase letters/digits.
DOCS_STORAGE_ACCOUNT=

# GHCR images built by .github/workflows/build-push.yml. GHCR_TOKEN: a classic GitHub PAT
# with read:packages only, used by Azure to pull the private images.
GITHUB_REPOSITORY=fporoli/apensum
GHCR_USERNAME=
GHCR_TOKEN=
IMAGE_TAG=latest

# Generate once and keep: changing them later locks the apps out of an existing database.
# POSTGRES_PASSWORD is embedded unencoded in DATABASE_URL, so letters and digits only, and
# Flexible Server wants upper case, lower case and digits (hex alone is rejected):
#   openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 40
POSTGRES_PASSWORD=
KEYCLOAK_ADMIN=admin
# openssl rand -base64 32
KEYCLOAK_ADMIN_PASSWORD=
API_JWT_SECRET=

# Outgoing mail, optional: unset SMTP_HOST leaves mail as a silent no-op.
SMTP_HOST=
SMTP_PORT=587
SMTP_FROM=worktime@localhost
SMTP_USER=
SMTP_PASSWORD=
SMTP_SECURE=false

# AI: Azure OpenAI in Switzerland is the only provider (the chat assistant, Cases, receipt recognition),
# every call through the budget. Optional and paid: it stays off unless the key, AI_MONTHLY_BUDGET_CHF and
# all three prices are set (fail closed). Resources: infra/azure/ai-provision.sh (Switzerland North, Standard deployments;
# `ai-provision.sh local` fills this file).
# AI_MONTHLY_BUDGET_CHF caps the whole instance per month; each org has its own limit (default CHF 10).
# AI_AZURE_ENABLED=false is the kill switch. Prices in CHF from your Azure price sheet (round up).
# AZURE_OPENAI_ENDPOINT=https://<resource>.openai.azure.com
# AZURE_OPENAI_KEY=
# AZURE_OPENAI_DEPLOYMENT=gpt-4.1-mini
# AZURE_OPENAI_TRANSCRIBE_DEPLOYMENT=whisper
AI_MONTHLY_BUDGET_CHF=5
# AI_AZURE_ENABLED=true
AZURE_TRANSCRIBE_CHF_PER_HOUR=1.00
AZURE_OPENAI_CHF_PER_1M_INPUT=0.50
AZURE_OPENAI_CHF_PER_1M_OUTPUT=2.00
# Higher AI levels (docs/dev/AI.md): a deployment and prices each; unset = the level is not offered.
# Leave them off on test instances (they spend the instance's budget). A reasoning model gets its effort.
# AZURE_OPENAI_DEPLOYMENT_ADVANCED=gpt-4.1
# AZURE_OPENAI_CHF_PER_1M_INPUT_ADVANCED=2.00
# AZURE_OPENAI_CHF_PER_1M_OUTPUT_ADVANCED=8.00
# AZURE_OPENAI_REASONING_ADVANCED=
# AZURE_OPENAI_DEPLOYMENT_MAX=o4-mini
# AZURE_OPENAI_CHF_PER_1M_INPUT_MAX=1.10
# AZURE_OPENAI_CHF_PER_1M_OUTPUT_MAX=4.40
# AZURE_OPENAI_REASONING_MAX=high
